<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#TEAMBRO Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Saira:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#EEF1FF; --surface:#FFFFFF; --surface-2:#E6EBFF; --encre:#0A0F33; --encre-2:#4A5283; --trait:#CCD3F3;
  --bleu:#1E46FF; --bleu-encre:#FFFFFF; --bleu-doux:#DCE4FF; --rose:#E8137A; --rose-encre:#FFFFFF; --rose-doux:#FFE1F0;
  --gris:#7C83AB; --jaune:#C98A00; --jaune-doux:#FFF1CC;
  --tv-fond:#03051A; --tv-panneau:#090E30; --tv-panneau-2:#0E1442; --tv-encre:#F3F5FF; --tv-encre-2:#8E97D6; --tv-trait:#1B2461;
  --tv-bleu:#2F6BFF; --tv-bleu-neon:#6E97FF; --tv-rose:#FF2E9A; --tv-rose-neon:#FF7AC2; --tv-jaune:#FFD23F;
  --rayon:10px;
  --titre:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --texte:Saira,"Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fond:#060A22; --surface:#0E1437; --surface-2:#161D49; --encre:#ECEFFF; --encre-2:#A2A9D8; --trait:#262F66;
    --bleu:#3F6DFF; --bleu-doux:#17225E; --rose:#FF3DA0; --rose-doux:#3E1233; --gris:#8A91BE; --jaune:#FFC93D; --jaune-doux:#3A2E0E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fond:#060A22; --surface:#0E1437; --surface-2:#161D49; --encre:#ECEFFF; --encre-2:#A2A9D8; --trait:#262F66;
  --bleu:#3F6DFF; --bleu-doux:#17225E; --rose:#FF3DA0; --rose-doux:#3E1233; --gris:#8A91BE; --jaune:#FFC93D; --jaune-doux:#3A2E0E;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--fond);color:var(--encre);font:16px/1.5 var(--texte);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--titre);font-weight:800;line-height:1.05;margin:0;letter-spacing:.01em}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

/* En-tête : la barre transversale */
.entete{background:var(--surface);border-bottom:1px solid var(--trait)}
.transversale{height:6px;background:linear-gradient(90deg,var(--bleu),var(--rose))}
.entete-in{max-width:1320px;margin:0 auto;padding:14px 18px 4px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.marque{font-family:var(--titre);font-size:2.1rem;font-weight:900;line-height:1;letter-spacing:.01em;display:flex;gap:.35em;align-items:baseline;flex-wrap:wrap}
.marque .tb{color:var(--rose)}
.marque .pv{color:var(--bleu)}
.marque small{font-family:var(--texte);font-size:.95rem;font-weight:500;color:var(--encre-2);letter-spacing:0}
.sync{font-size:.85rem;color:var(--encre-2);display:flex;align-items:center;gap:8px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--gris);display:inline-block}
.sync[data-s="ok"] i{background:var(--bleu);box-shadow:0 0 0 3px var(--bleu-doux)}
.sync[data-s="erreur"] i{background:var(--rose)}
.onglets{max-width:1320px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.onglets button{border:0;background:transparent;padding:12px 14px 10px;cursor:pointer;font-family:var(--titre);font-size:1.3rem;font-weight:800;color:var(--encre-2);border-bottom:4px solid transparent;white-space:nowrap;letter-spacing:.02em}
.onglets button[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--bleu)}
.onglets button.tv-lien{color:var(--rose)}
.onglets button:hover{color:var(--encre)}

main{max-width:1320px;margin:0 auto;padding:20px 18px 70px}
.bloc{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);padding:18px 20px;margin-bottom:18px}
.bloc > h2,.bloc > h3{margin-bottom:10px}
.discret{color:var(--encre-2);font-size:.93rem;max-width:78ch}
.grille{display:grid;gap:14px 18px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
label.champ{display:flex;flex-direction:column;gap:4px;font-size:.92rem;font-weight:500}
label.champ small{font-weight:400;color:var(--encre-2)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{background:var(--surface-2);border:1px solid var(--trait);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:120px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
input:focus,select:focus,textarea:focus{border-color:var(--bleu);outline:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--trait);background:var(--surface);padding:9px 16px;min-height:42px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.bleu{background:var(--bleu);border-color:var(--bleu);color:var(--bleu-encre)}
.btn.rose{background:var(--rose);border-color:var(--rose);color:var(--rose-encre)}
.btn.bleu:hover,.btn.rose:hover{filter:brightness(1.1)}
.btn.petit{min-height:32px;padding:4px 10px;font-size:.88rem;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}

/* Poste de concours */
.poste{display:grid;grid-template-columns:minmax(200px,.8fr) minmax(320px,1.5fr) minmax(240px,1fr);gap:16px;margin-bottom:18px}
@media (max-width:980px){.poste{grid-template-columns:1fr 1fr}.poste .carte-saut{grid-column:1/-1;order:-1}}
@media (max-width:620px){.poste{grid-template-columns:1fr}}
.carte{background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.carte .lbl{font-size:.88rem;color:var(--encre-2);font-weight:500}
.hauteur-geante{font-family:var(--titre);font-weight:900;font-size:4.6rem;line-height:.9;color:var(--bleu);font-variant-numeric:tabular-nums}
.hauteur-geante small{font-size:.45em;color:var(--encre-2);margin-left:4px}
.croquis-barre{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bleu),var(--rose));position:relative;margin:6px 10px 2px}
.croquis-barre::before,.croquis-barre::after{content:"";position:absolute;bottom:-26px;width:6px;height:40px;background:var(--encre-2);border-radius:3px}
.croquis-barre::before{left:-10px}.croquis-barre::after{right:-10px}
.carte-saut{border:2px solid var(--bleu)}
.carte-saut .nom{font-family:var(--titre);font-weight:900;font-size:2.6rem;line-height:.95;overflow-wrap:anywhere}
.carte-saut .meta{color:var(--encre-2);display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.95rem}
.carte-saut .meta b{color:var(--encre)}
.points{display:flex;gap:10px;align-items:center}
.point{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--trait);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.point.O{background:var(--bleu);border-color:var(--bleu);color:#fff}
.point.X{background:var(--rose);border-color:var(--rose);color:#fff}
.point.P{background:var(--gris);border-color:var(--gris);color:#fff}
.point.suivant{border-color:var(--bleu);border-style:dashed}
.decision{display:grid;grid-template-columns:1fr 1fr .7fr;gap:10px;margin-top:6px}
.decision .btn{min-height:72px;font-size:1.25rem;font-family:var(--titre);font-weight:900;letter-spacing:.03em;flex-direction:column;gap:0;line-height:1}
.decision .btn kbd{font-family:var(--texte);font-size:.72rem;font-weight:500;opacity:.8;margin-top:4px}
.chrono-juge{font-family:var(--titre);font-weight:900;font-size:4.4rem;line-height:.9;font-variant-numeric:tabular-nums}
.chrono-juge[data-a="1"]{color:var(--jaune)}
.chrono-juge[data-a="2"]{color:var(--rose)}
.chrono-juge[data-a="r"]{color:var(--bleu)}
.auto-barre{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--surface);border:1px solid var(--trait);border-radius:var(--rayon);padding:10px 16px;margin-bottom:14px}
.interrupteur{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font-weight:600;padding:4px 0}
.interrupteur .piste-i{width:46px;height:26px;border-radius:999px;background:var(--trait);position:relative;transition:background .2s}
.interrupteur .piste-i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.interrupteur[aria-pressed="true"] .piste-i{background:linear-gradient(90deg,var(--bleu),var(--rose))}
.interrupteur[aria-pressed="true"] .piste-i::after{transform:translateX(20px)}
.auto-barre .discret{margin:0}
.ensuite{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:16px;color:var(--encre-2)}
.ensuite b{color:var(--encre);font-weight:600}
.poteaux{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.poteaux .lbl{color:var(--encre-2);font-size:.9rem;margin-right:2px}
.poteaux .val{font-family:var(--titre);font-weight:900;font-size:1.9rem;line-height:1;min-width:2.2ch;text-align:right;color:var(--encre)}
.poteaux .unite{color:var(--encre-2);margin-right:6px}
.poteaux .btn{min-height:36px;padding:4px 11px}
.a-changer{color:var(--rose);font-weight:600}
.phrases{display:grid;gap:12px}
.phrase{display:grid;grid-template-columns:minmax(150px,220px) 1fr auto;gap:8px 12px;align-items:center}
@media (max-width:700px){.phrase{grid-template-columns:1fr auto}.phrase label{grid-column:1/-1}}
.phrase label{font-weight:600;font-size:.92rem}
.jetons{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.jetons code{background:var(--surface-2);border:1px solid var(--trait);border-radius:6px;padding:1px 7px;font-size:.85rem}
.annonce-libre{display:flex;gap:10px;flex-wrap:wrap}
.annonce-libre input{flex:1;min-width:220px}
.tv-liaison{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:var(--tv-panneau-2);border:1px solid var(--tv-trait);border-radius:16px;padding:28px 32px;text-align:center;max-width:90vw;box-shadow:0 0 60px rgba(47,107,255,.35)}
.tv-liaison h3{font-size:clamp(22px,4vh,44px);margin-bottom:10px}
.tv-liaison p{color:var(--tv-encre-2);margin:0 0 14px}
.tv-liaison input{font:800 clamp(22px,4vh,40px) var(--titre);letter-spacing:.25em;text-transform:uppercase;text-align:center;background:var(--tv-fond);color:var(--tv-encre);border:2px solid var(--tv-bleu);border-radius:10px;padding:8px 12px;width:9ch;min-height:0}
.tv-liaison button{margin-left:10px;background:var(--tv-bleu);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 18px var(--texte);cursor:pointer}
.tv-etat-liaison{position:absolute;left:1.4vw;bottom:1.4vh;z-index:9;font-size:13px;color:var(--tv-encre-2);background:rgba(0,0,0,.35);border-radius:999px;padding:4px 12px}
.alerte{background:var(--rose-doux);border-left:4px solid var(--rose);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.info{background:var(--bleu-doux);border-left:4px solid var(--bleu);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}

/* Feuille de hauteur */
.defil{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--rayon);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;border-bottom:1px solid var(--trait);text-align:left;white-space:nowrap}
th{font-weight:600;font-size:.85rem;color:var(--encre-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.feuille th.h,.feuille td.h{text-align:center;border-left:1px solid var(--trait);min-width:58px;padding:0}
.feuille th.h{padding:7px 4px;font-family:var(--titre);font-size:1.05rem;font-weight:800;color:var(--encre)}
.feuille th.h.cur{background:var(--bleu);color:#fff}
.feuille td.h.cur{background:color-mix(in srgb,var(--bleu-doux) 70%,transparent)}
.feuille td.h button{width:100%;min-height:42px;border:0;background:transparent;cursor:pointer;font-weight:700;letter-spacing:.12em;font-size:1rem}
.feuille td.h button:hover{background:var(--surface-2)}
.m-O{color:var(--bleu)}.m-X{color:var(--rose)}.m-P{color:var(--gris)}
.feuille tr.au-saut td{background:var(--bleu-doux)}
.feuille tr.au-saut td.nom{box-shadow:inset 5px 0 0 var(--bleu)}
.feuille tr.hors td:not(.h){opacity:.55}
.feuille td.perf{font-weight:700;font-size:1.05rem}
.feuille td.rang{font-family:var(--titre);font-size:1.4rem;font-weight:900;text-align:center}
.feuille td.nom button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600}
.feuille td.nom small{display:block;color:var(--encre-2);font-weight:400}
.etiq{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--trait);margin-left:6px;vertical-align:middle}
.etiq.rose{background:var(--rose-doux);border-color:var(--rose)}
.etiq.bleu{background:var(--bleu-doux);border-color:var(--bleu)}

.liste-ath td .ordre{display:inline-flex;gap:4px}

/* Modale & toast */
#modale{position:fixed;inset:0;background:rgba(3,5,26,.55);display:grid;place-items:center;padding:20px;z-index:50}
#modale[hidden]{display:none}
#modale .boite{background:var(--surface);color:var(--encre);border-radius:14px;padding:20px 22px;max-width:520px;width:100%;max-height:85vh;overflow:auto;border-top:6px solid var(--bleu)}
#modale .boite h3{margin-bottom:8px}
#toast{opacity:0;visibility:hidden;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:var(--encre);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
#toast.vu{transform:translate(-50%,0);opacity:1;visibility:visible}

/* ============ AFFICHAGE TÉLÉ ============ */
#tv{position:fixed;inset:0;background:var(--tv-fond);color:var(--tv-encre);font-family:var(--texte);overflow:hidden;z-index:40;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  background-image:radial-gradient(ellipse 70% 55% at 12% 0%,rgba(47,107,255,.22),transparent 70%),radial-gradient(ellipse 60% 50% at 100% 100%,rgba(255,46,154,.16),transparent 70%)}
#tv[hidden]{display:none}
.tv{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:1.6vh;padding:2.4vh 2.6vw}
.tv-haut{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.tv-marque{font-family:var(--titre);font-weight:900;font-size:clamp(22px,3.6vh,54px);line-height:1;display:flex;gap:.3em;align-items:baseline}
.tv-marque .tb{color:var(--tv-rose);text-shadow:0 0 18px rgba(255,46,154,.55)}
.tv-marque .pv{color:var(--tv-bleu-neon);text-shadow:0 0 18px rgba(47,107,255,.6)}
.tv-concours{font-size:clamp(14px,2.3vh,32px);color:var(--tv-encre-2);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-heure{font-family:var(--titre);font-weight:800;font-size:clamp(20px,3.6vh,52px);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:.5em}
.tv-direct{width:.45em;height:.45em;border-radius:50%;background:var(--tv-rose);box-shadow:0 0 12px var(--tv-rose)}
.tv-direct.off{background:var(--tv-encre-2);box-shadow:none}

.tv-scene{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:1.6vw;min-height:0}
.tv-panneau{background:linear-gradient(180deg,var(--tv-panneau-2),var(--tv-panneau));border:1px solid var(--tv-trait);border-radius:1.6vh;padding:2.2vh 1.8vw;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative;overflow:hidden}
.tv-lbl{font-size:clamp(12px,1.9vh,26px);color:var(--tv-encre-2);font-weight:500}

.tv-hauteur{font-family:var(--titre);font-weight:900;font-size:clamp(60px,15vh,230px);line-height:.82;color:#fff;text-shadow:0 0 28px rgba(47,107,255,.85),0 0 70px rgba(47,107,255,.45);font-variant-numeric:tabular-nums;white-space:nowrap}
.tv-hauteur small{font-size:.32em;color:var(--tv-bleu-neon);margin-left:.08em;text-shadow:none}
.tv-poteaux{position:relative;height:5vh;margin:2.6vh .6vw 0}
.tv-poteaux .barre{position:absolute;left:0;right:0;top:0;height:1.1vh;border-radius:1vh;background:linear-gradient(90deg,var(--tv-bleu),var(--tv-rose));box-shadow:0 0 18px rgba(47,107,255,.8),0 0 30px rgba(255,46,154,.45)}
.tv-poteaux::before,.tv-poteaux::after{content:"";position:absolute;top:-1.2vh;width:.8vh;height:6.4vh;border-radius:.4vh;background:var(--tv-encre-2)}
.tv-poteaux::before{left:-1.2vh}.tv-poteaux::after{right:-1.2vh}
.tv-sous{font-size:clamp(12px,2vh,28px);color:var(--tv-encre-2);margin-top:.6vh}
.tv-sous b{color:var(--tv-encre);font-weight:600}

.tv-dossard{display:inline-block;font-family:var(--titre);font-weight:800;font-size:clamp(16px,2.8vh,40px);background:var(--tv-encre);color:var(--tv-fond);padding:.05em .45em;border-radius:.25em;align-self:flex-start;margin-bottom:1vh}
.tv-nom{font-family:var(--titre);font-weight:900;font-size:clamp(34px,8.4vh,124px);line-height:.88;overflow-wrap:anywhere}
.tv-nom .prenom{display:block;font-size:.5em;color:var(--tv-encre-2);font-weight:800;line-height:1.05}
.tv-club{font-size:clamp(14px,2.4vh,34px);color:var(--tv-encre-2);margin-top:1vh}
.tv-essais{display:flex;align-items:center;gap:1.2vw;margin-top:2.4vh;flex-wrap:wrap}
.tv-essais .lbl{font-size:clamp(14px,2.3vh,32px);color:var(--tv-encre-2)}
.tv-pt{width:5vh;height:5vh;border-radius:50%;border:.45vh solid var(--tv-trait);display:grid;place-items:center;font-family:var(--titre);font-weight:900;font-size:2.8vh}
.tv-pt.O{background:var(--tv-bleu);border-color:var(--tv-bleu-neon);box-shadow:0 0 16px rgba(47,107,255,.8)}
.tv-pt.X{background:var(--tv-rose);border-color:var(--tv-rose-neon);box-shadow:0 0 16px rgba(255,46,154,.7)}
.tv-pt.P{background:var(--tv-encre-2);border-color:var(--tv-encre-2)}
.tv-pt.suivant{border-color:var(--tv-encre);border-style:dashed}
.tv-refs{display:flex;gap:2vw;margin-top:1.8vh;font-size:clamp(13px,2.2vh,30px);color:var(--tv-encre-2)}
.tv-refs b{color:var(--tv-encre);font-family:var(--titre);font-weight:800;font-size:1.2em}

.tv-chrono{align-items:center;text-align:center}
.tv-anneau{position:relative;width:min(100%,32vh);aspect-ratio:1;border-radius:50%;box-shadow:0 0 40px rgba(255,46,154,.28)}
.tv-anneau[data-e="idle"]{box-shadow:none}
.tv-anneau[data-e="idle"] .arc{stroke:var(--tv-bleu);opacity:.55}
.tv-anneau[data-a="1"]{box-shadow:0 0 46px rgba(255,210,63,.35)}
.tv-anneau svg{width:100%;height:100%;transform:rotate(-90deg)}
.tv-anneau .fond{stroke:var(--tv-trait)}
.tv-anneau .arc{stroke:var(--tv-rose);transition:stroke .3s}
.tv-anneau[data-a="1"] .arc{stroke:var(--tv-jaune)}

function num(v,def=0){ const n=parseFloat(String(v??'').replace(',','.')); return isNaN(n)?def:n; }
function arrondiOfficiel(ms){ const s=ms/1000; return C().arrondi==='millieme' ? Math.ceil(s*1000-1e-6)/1000 : Math.ceil(s*100-1e-6)/100; }
function fT(ms, precis){
  if(ms==null || isNaN(ms)) return '';
  const s = precis ? Math.round(ms)/1000 : arrondiOfficiel(ms), dec = precis||C().arrondi==='millieme' ? 3 : 2;
  if(s<60) return s.toFixed(dec);
  const m=Math.floor(s/60); return m+':'+(s-m*60).toFixed(dec).padStart(dec+3,'0');
}
function fPerf(v){ v=num(v,null); return v==null?'':v.toFixed(2); }
function vitesseSon(){ return 331.3 + 0.606*num(C().temperature,20); }

/* ---------- Séries ---------- */
function serieCourante(){ return SER(D.courante) || D.series[0] || null; }
function couloirsDe(s){ if(enLigne()) return s ? Object.keys(s.couloirs).map(Number).sort((a,b) => a-b).map(c => ({c, a:A(s.couloirs[c])})).filter(x => x.a) : []; const n=+C().nbCouloirs||8; return Array.from({length:n},(_,i) => i+1).map(c => ({c, a:s && s.couloirs[c] ? A(s.couloirs[c]) : null})); }
function lignesResultats(s){
  const r=(D.resultats[s.id]||[]).slice();
  const ok=r.filter(x => x.t!=null && !x.statut).sort((a,b) => arrondiOfficiel(a.t)-arrondiOfficiel(b.t) || a.t-b.t);
  let prec=null; ok.forEach((x,i) => { x.place = prec && arrondiOfficiel(prec.t)===arrondiOfficiel(x.t) && C().departageMillieme!=='oui' ? prec.place : i+1; prec=x; });
  return [...ok, ...r.filter(x => !(x.t!=null && !x.statut))];
}
function classementGeneral(){
  const L=[];
  D.series.forEach(s => (D.resultats[s.id]||[]).forEach(x => { if(x.t!=null && !x.statut) L.push({...x, serie:s}); }));
  L.sort((a,b) => arrondiOfficiel(a.t)-arrondiOfficiel(b.t) || a.t-b.t);
  let prec=null; L.forEach((x,i) => { x.rang = prec && arrondiOfficiel(prec.t)===arrondiOfficiel(x.t) ? prec.rang : i+1; prec=x; });
  return L;
}
function construireSeries(){
  const avec=D.athletes.filter(a => a.serie);
  if(avec.length){
    const noms=[...new Set(avec.map(a => String(a.serie)))].sort((x,y) => (parseFloat(x)||0)-(parseFloat(y)||0) || x.localeCompare(y));
    D.series=noms.map(n => ({id:uid(), nom:/^\d+$/.test(n)?'Série '+n:n, couloirs:{}, vent:null}));
    avec.forEach(a => { const s=D.series[noms.indexOf(String(a.serie))]; let c=parseInt(a.couloir); if(!c || s.couloirs[c]) c=premierLibre(s); if(c) s.couloirs[c]=a.id; });
  } else if(enLigne()){
    const n=Math.max(2,+C().maxParSerie||16), L=D.athletes.slice(); D.series=[];
    for(let i=0;i<L.length;i+=n){ const s={id:uid(), nom:'Course '+(D.series.length+1), couloirs:{}, vent:null}; L.slice(i,i+n).forEach((a,j) => s.couloirs[j+1]=a.id); D.series.push(s); }
  } else {
    const n=+C().nbCouloirs||8, ordre=[4,5,3,6,2,7,1,8,9,10].filter(c => c<=n), L=D.athletes.slice();
    D.series=[];
    for(let i=0;i<L.length;i+=n){ const s={id:uid(), nom:'Série '+(D.series.length+1), couloirs:{}, vent:null}; L.slice(i,i+n).forEach((a,j) => s.couloirs[ordre[j]||j+1]=a.id); D.series.push(s); }
  }
  D.courante=D.series[0]?.id||null; D.resultats={};
}
function premierLibre(s){ for(let c=1;c<=(+C().nbCouloirs||8);c++) if(!s.couloirs[c]) return c; return null; }

/* ---------- Transport : claude.ai (db + room) ou GitHub (PeerJS) ---------- */
const T={mode:'local', db:null, room:null, refD:null, refC:null, peer:null, conns:[], hub:null, etat:'', ecr:{D:false,K:false}, sale:{D:false,K:false}, tmr:{}};
let canal=null; try{ canal=new BroadcastChannel('teambro-sprint'); canal.onmessage=ev => recevoirMsg(ev.data, true); }catch(e){}
let decal=0, decalRtt=null, decalVu=0;  // horloge de l’arrivée = horloge() + decal
function horlogeArrivee(){ return horloge() + (vue==='arrivee' ? 0 : decal); }
function sauverLocal(){ try{ localStorage.setItem(CLE, JSON.stringify(D)); localStorage.setItem(CLE+'-course', JSON.stringify(K)); }catch(e){} }
function publierD(rendre=true){ D.maj=Date.now(); D.rev=(D.rev||0)+1; try{ D.resume={type:'sprint', titre:C().epreuve, unite:'s', top:classementGeneral().slice(0,8).map(x => { const a=A(x.id); return {r:x.rang, n:nomComplet(a), c:a?.club||'', p:fT(x.t)}; }), sections:(typeof sectionsPubliques==='function'?sectionsPubliques():[]), partants:{serie:D.courante, liste:couloirsDe(serieCourante()).filter(x => x.a).map(x => ({c:enLigne()?(x.a.dossard||x.c):x.c, n:nomComplet(x.a), club:x.a.club||''}))}}; }catch(e){} sauverLocal(); const json=JSON.stringify(D); envoyer({t:'D', json}); planifier('D'); if(rendre) toutRendre(); }
function publierK(etat, extra={}, rendre=true){ K={...K, ...extra, etat, ts:Date.now(), seq:(K.seq||0)+1}; sauverLocal(); envoyer({t:'K', json:JSON.stringify(K)}); planifier('K'); if(rendre) toutRendre(); }
function envoyer(m){
  if(canal) try{ canal.postMessage(m); }catch(e){}
  if(T.mode==='libre'){ if(T.hub){ T.conns.forEach(c => { try{ if(c.open) c.send(m); }catch(e){} }); } else if(T.peer && T.peerConn && T.peerConn.open){ try{ T.peerConn.send(m); }catch(e){} } }
}
function planifier(q){
  if(T.mode!=='claude') return; const ref=q==='D'?T.refD:T.refC; if(!ref) return;
  T.sale[q]=true; clearTimeout(T.tmr[q]); T.tmr[q]=setTimeout(() => ecrire(q), 80);
}
async function ecrire(q){
  if(T.ecr[q] || !T.sale[q]) return; T.ecr[q]=true; T.sale[q]=false;
  const ref=q==='D'?T.refD:T.refC, obj=q==='D'?D:K;
  try{ await ref.set({json:JSON.stringify(obj), maj:q==='D'?obj.maj:obj.ts}); majSync('ok'); }catch(e){ majSync('erreur'); }
  T.ecr[q]=false; if(T.sale[q]) ecrire(q);
}
function recevoirMsg(m, local){
  if(!m) return;
  try{
    if(m.t==='D'){ const r=fusionD(JSON.parse(m.json)); if((r.rev||0)>(D.rev||0) || ((r.rev||0)===(D.rev||0) && r.maj>D.maj)){ D=r; sauverLocal(); apresReception(); } }
    else if(m.t==='K'){ const r={...courseDefaut(), ...JSON.parse(m.json)}; if((r.seq||0)>(K.seq||0) || ((r.seq||0)===(K.seq||0) && r.ts>K.ts)){ const avant=K; K=r; sauverLocal(); surChangementCourse(avant); apresReception(); } }
    else if(m.t==='ping'){ if(vue==='arrivee') repondrePing(m); }
    else if(m.t==='pong'){ if(m.a===MOI) recevoirPong(m); }
  }catch(e){}
  if(T.mode==='libre' && T.hub && !local && (m.t==='D'||m.t==='K')) envoyer(m);
}
async function initTransport(){
  if(window.claude && typeof claude.use==='function'){
    T.mode='claude';
    try{ T.db=await claude.use('db'); }catch(e){}
    try{ T.room=await claude.use('room'); }catch(e){}
    if(T.db){
      T.refD=T.db.doc('sprint/donnees'); T.refC=T.db.doc('sprint/course');
      T.refD.onSnapshot(s => { if(!s.exists){ if(D.maj) planifier('D'); return; } recevoirMsg({t:'D', json:s.data().json}, true); majSync('ok'); }, () => majSync('erreur'));
      T.refC.onSnapshot(s => { if(!s.exists){ if(K.ts) planifier('K'); return; } recevoirMsg({t:'K', json:s.data().json}, true); }, () => {});
    }
    if(T.room){ T.room.on('ping', m => recevoirMsg({...m.data, t:'ping'}, true)); T.room.on('pong', m => recevoirMsg({...m.data, t:'pong'}, true)); }
    majSync(T.db?'ok':'local');
  } else { T.mode='libre'; majLiaison(); }
  setInterval(pinguer, 2000); pinguer();
}
/* Synchronisation d’horloge avec le téléphone d’arrivée (type NTP) */
let echantillons=[];
function pinguer(){
  if(vue==='arrivee') return;
  const m={t0:horloge(), a:MOI};
  if(T.mode==='claude' && T.room) T.room.emit('ping', m).catch(()=>{});
  else if(T.mode==='libre') envoyer({t:'ping', ...m});
  if(canal) try{ canal.postMessage({t:'ping', ...m}); }catch(e){}
}
function repondrePing(m){
  const r={t0:m.t0, tf:horloge(), a:m.a};
  if(T.mode==='claude' && T.room) T.room.emit('pong', r).catch(()=>{});
  if(T.mode==='libre') envoyer({t:'pong', ...r});
  if(canal) try{ canal.postMessage({t:'pong', ...r}); }catch(e){}
}
function recevoirPong(m){
  const t1=horloge(), rtt=t1-m.t0; if(rtt<0 || rtt>3000) return;
  echantillons.push({rtt, off:m.tf-(m.t0+t1)/2, ts:Date.now()}); echantillons=echantillons.filter(e => Date.now()-e.ts<120000).slice(-40);
  const best=echantillons.slice().sort((a,b) => a.rtt-b.rtt)[0];
  decal=best.off; decalRtt=best.rtt; decalVu=Date.now();
  const el=document.getElementById('etatSynchro'); if(el) el.innerHTML=htmlSynchro();
}
function htmlSynchro(){
  if(vue==='arrivee') return 'Ce téléphone est l’horloge de référence.';
  if(decalRtt==null || Date.now()-decalVu>15000) return '<span class="m-X">Téléphone d’arrivée introuvable : ouvrez l’onglet « Arrivée » sur le téléphone de la ligne.</span>';
  return `Synchronisé avec l’arrivée, précision estimée ± ${Math.max(1,Math.round(decalRtt/2))} ms.`;
}
function majSync(s){
  const el=document.getElementById('sync'); if(!el) return;
  if(T.mode==='libre'){ const n=T.hub ? T.conns.filter(c => c.open).length : (T.peerConn&&T.peerConn.open?1:0);
    el.dataset.s=n?'ok':'local'; el.querySelector('span').textContent = T.hub ? `Code ${C().salle} · ${n} appareil${n>1?'s':''} relié${n>1?'s':''}` : (n ? `Relié à l’arrivée (${codeLibre()})` : `En attente du téléphone d’arrivée (${codeLibre()||'sans code'})`); return; }
  el.dataset.s=s; el.querySelector('span').textContent=({ok:'Synchronisé', erreur:'Synchro interrompue', local:'Enregistré sur cet appareil'})[s]||'';
}
const PEERJS='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'; let peerjsCharge=null;
function chargerPeerJS(){ if(window.Peer) return Promise.resolve(); if(!peerjsCharge) peerjsCharge=new Promise((ok,ko) => { const s=document.createElement('script'); s.src=PEERJS; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); return peerjsCharge; }
function codeLibre(){ if(vue==='arrivee') return C().salle; const q=new URLSearchParams(location.search).get('salle'); if(q) return q.toUpperCase(); try{ return (localStorage.getItem(CLE_SALLE)||C().salle||'').toUpperCase(); }catch(e){ return C().salle; } }
function detruirePeer(){ try{ if(T.peer) T.peer.destroy(); }catch(e){} T.peer=null; T.conns=[]; T.hub=null; T.peerConn=null; clearTimeout(T.retry); }
async function majLiaison(){
  if(T.mode!=='libre') return;
  try{ await chargerPeerJS(); }catch(e){ majSync('local'); return; }
  const hub = vue==='arrivee';
  if(T.peer && !T.peer.destroyed && !!T.hub===hub) return;
  detruirePeer();
  if(hub){
    T.hub=true; T.peer=new Peer('teambro-sp-'+C().salle);
    T.peer.on('connection', c => { T.conns.push(c);
      c.on('open', () => { try{ c.send({t:'D', json:JSON.stringify(D)}); c.send({t:'K', json:JSON.stringify(K)}); }catch(e){} majSync(); });
      c.on('data', d => recevoirMsg(d,false)); c.on('close', () => { T.conns=T.conns.filter(x => x!==c); majSync(); }); });
    T.peer.on('open', () => majSync()); T.peer.on('error', () => majSync());
    T.peer.on('disconnected', () => setTimeout(() => { try{ T.peer && T.peer.reconnect(); }catch(e){} }, 2000));
  } else {
    const code=codeLibre(); if(!code){ majSync(); return; }
    T.peer=new Peer();
    const retry=() => { clearTimeout(T.retry); T.retry=setTimeout(() => { detruirePeer(); majLiaison(); }, 3000); majSync(); };
    T.peer.on('open', () => { const c=T.peer.connect('teambro-sp-'+code, {reliable:true});
      c.on('open', () => { T.peerConn=c; majSync(); envoyer({t:'D', json:JSON.stringify(D)}); });
      c.on('data', d => recevoirMsg(d,false)); c.on('close', retry); c.on('error', retry); });
    T.peer.on('error', retry);
  }
}

/* =========================================================
   Détection du coup de pistolet (micro)
   ========================================================= */
const MIC={ctx:null, an:null, buf:null, flux:null, niveau:0, pic:0, traite:0, derniere:0, tmr:null, arme:false};
async function activerMicro(){
  if(MIC.ctx) { if(MIC.ctx.state==='suspended') await MIC.ctx.resume(); return true; }
  try{
    MIC.flux=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1}});
    MIC.ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    const src=MIC.ctx.createMediaStreamSource(MIC.flux); MIC.an=MIC.ctx.createAnalyser(); MIC.an.fftSize=2048; src.connect(MIC.an);
    MIC.buf=new Float32Array(MIC.an.fftSize); MIC.traite=MIC.ctx.currentTime;
    MIC.tmr=setInterval(ecouterMicro, 12);
    return true;
  }catch(e){ toast('Micro indisponible : autorisez l’accès au micro'); return false; }
}
function ecouterMicro(){
  if(!MIC.an) return;
  const perfNow=horloge(), ctxNow=MIC.ctx.currentTime, sr=MIC.ctx.sampleRate, N=MIC.buf.length;
  MIC.an.getFloatTimeDomainData(MIC.buf);
  let mx=0; for(let i=0;i<N;i++){ const v=Math.abs(MIC.buf[i]); if(v>mx) mx=v; }
  MIC.niveau=mx; MIC.pic=Math.max(MIC.pic*0.97, mx);
  const seuil=Math.min(0.99, Math.max(0.02, num(C().sensibilite,0.35)));
  if(MIC.arme){
    for(let i=0;i<N;i++){
      const ts=ctxNow-(N-1-i)/sr; if(ts<=MIC.traite) continue;
      if(Math.abs(MIC.buf[i])>=seuil && ts-MIC.derniere>0.25){ MIC.derniere=ts; const tAbs=perfNow-(ctxNow-ts)*1000-num(C().corrMicro,0); MIC.traite=ctxNow; coupDetecte(tAbs); return; }
    }
  }
  MIC.traite=ctxNow;
  const m=document.getElementById('vumetre'); if(m){ m.style.setProperty('--n', Math.min(1,mx).toFixed(3)); m.style.setProperty('--s', seuil.toFixed(3)); }
}
function bip(f=1000,d=.12){ try{ const c=MIC.ctx||(MIC.ctx2||(MIC.ctx2=new AudioContext())); const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; g.gain.value=.2; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d); }catch(e){} }
/* Le téléphone qui écoute le pistolet : celui du départ, ou celui de l’arrivée en mode « micro à l’arrivée » */
function ecouteIci(){ return (vue==='depart' && C().modeDepart==='depart') || (vue==='arrivee' && C().modeDepart==='micro'); }
function versHorlogeArrivee(t){ return vue==='arrivee' ? t : t+decal; }
function coupDetecte(tAbs){
  const s=serieCourante(); if(!s) return;
  if(K.etat==='pret'){
    const dist = C().modeDepart==='micro' ? num(C().distArrivee,100) : num(C().distDepart,0);
    const tDep = versHorlogeArrivee(tAbs) - dist/vitesseSon()*1000;
    bip(1400,.08);
    publierK('partie', {serie:s.id, departT:tDep, departSrc:C().modeDepart==='micro'?'micro arrivée':'téléphone départ', tours:enLigne()?toursInitiaux():null, passages:[]});
  } else if(K.etat==='partie' && K.departT!=null && versHorlogeArrivee(tAbs)-K.departT < num(C().fenetreFaux,5)*1000 + 400){
    bip(500,.4); rappel();
  }
}
function pret(){
  const s=serieCourante(); if(!s){ toast('Aucune série'); return; }
  if(K.etat==='partie'){ toast('Course en cours'); return; }
  publierK('pret', {serie:s.id, departT:null, departSrc:''});
  if(ecouteIci()) activerMicro().then(ok => { MIC.arme=ok; MIC.traite=MIC.ctx?MIC.ctx.currentTime:0; });
}
function departManuel(){ const s=serieCourante(); if(!s) return; if(K.etat!=='pret' && K.etat!=='attente'){ toast('Mettez d’abord la série en « prêt »'); return; } publierK('partie', {serie:s.id, departT:versHorlogeArrivee(horloge()), departSrc:'manuel', tours:enLigne()?toursInitiaux():null, passages:[]}); }
function passageTete(){ if(K.etat!=='partie'){ toast('Aucune course en cours'); return; } const t=versHorlogeArrivee(horloge()); const tours=K.tours!=null?Math.max(0,K.tours-1):null; publierK('partie', {tours, passages:[...(K.passages||[]), t]}); if(tours===1) bip(1800,.5); }
function rappel(){ if(K.etat!=='partie' && K.etat!=='pret') return; MIC.arme=false; publierK('rappel', {}); if(vue==='depart' || (vue==='arrivee' && C().modeDepart==='micro')) choisirFautif(); }
function choisirFautif(){
  const s=serieCourante(); if(!s) return;
  ouvrirModale(`<h3>Faux départ</h3><p class="discret">Touchez le couloir de l’athlète fautif (disqualifié), ou « Sans sanction » si le départ est annulé pour une autre raison. La série revient ensuite en attente.</p>
    <div class="grille-couloirs">${couloirsDe(s).filter(x => x.a).map(x => `<button class="btn" data-act="fautif" data-c="${x.c}"><b>C${x.c}</b> ${esc(nomComplet(x.a))}</button>`).join('')}</div>
    <div class="actions"><button class="btn bleu" data-act="fautif" data-c="0">Sans sanction (carton vert)</button></div>`);
}
function annulerCourse(){ MIC.arme=false; publierK('attente', {departT:null}); }

/* =========================================================
   Photo-finish : caméra, ligne d’arrivée, image balayée
   ========================================================= */
const CAM={flux:null, video:null, can:null, ctx:null, apercu:null, actif:false, fps:0, w:0, h:0, n:0, cadre:0,
  lig:null, // {x0,y0,ux,uy,smin,smax,n, xs, ys}
  bg:null, cols:[], temps:[], enreg:false, serie:null, detect:{}, frac:{}, calTap:null, dernierRendu:0};
function solve(M,v){ const n=v.length; const a=M.map((r,i) => [...r, v[i]]);
  for(let i=0;i<n;i++){ let p=i; for(let k=i+1;k<n;k++) if(Math.abs(a[k][i])>Math.abs(a[p][i])) p=k; [a[i],a[p]]=[a[p],a[i]]; if(Math.abs(a[i][i])<1e-12) return null;
    for(let k=0;k<n;k++) if(k!==i){ const f=a[k][i]/a[i][i]; for(let j=i;j<=n;j++) a[k][j]-=f*a[i][j]; } }
  return a.map((r,i) => r[n]/r[i]); }
/* Modèle projectif 1D du plan d’arrivée : s = (a·x + b·y + c) / (d·x + e·y + 1), x = distance depuis la corde, y = hauteur */
function calculerLigne(){
  CAM.lig=null; const P=CAL.pts; if(P.length<2) return;
  const p0=P[0], pN=P[P.length-1], L=Math.hypot(pN.x-p0.x, pN.y-p0.y); if(L<20) return;
  const ux=(pN.x-p0.x)/L, uy=(pN.y-p0.y)/L, proj=p => (p.x-p0.x)*ux+(p.y-p0.y)*uy;
  const w=num(C().largeur,1.22), rows=[], rhs=[];
  P.forEach((p,k) => { const s=proj(p), x=k*w; rows.push([x,0,1,-s*x,0]); rhs.push(s); });
  let modele=null;
  if(CAL.hauts.length===2){
    const H=num(C().hauteurRef,1.5), nL=P.length-1;
    [[0,CAL.hauts[0]],[nL*w,CAL.hauts[1]]].forEach(([x,p]) => { const s=proj(p); rows.push([x,H,1,-s*x,-s*H]); rhs.push(s); rows.push([x,H,1,-s*x,-s*H]); rhs.push(s); });
    const At=[0,1,2,3,4].map(j => rows.map(r => r[j])), M=At.map(r => [0,1,2,3,4].map(j => r.reduce((t,v,i) => t+v*rows[i][j],0))), v=At.map(r => r.reduce((t,x,i) => t+x*rhs[i],0));
    const sol=solve(M,v); if(sol) modele=sol;
  }
  const sOf=(x,y) => modele ? (modele[0]*x+modele[1]*y+modele[2])/(modele[3]*x+modele[4]*y+1) : null;
  let haut=proj(pN); if(modele){ const nL=P.length-1; for(let k=0;k<nL;k++) haut=Math.max(haut, sOf((k+0.5)*w, 2.1)); }
  let smin=-25, smax=haut+25;
  const W=CAM.w||1280, Hh=CAM.h||720, dans=s => { const x=p0.x+ux*s, y=p0.y+uy*s; return x>=0 && y>=0 && x<W && y<Hh; };

const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let xlsxCharge = null;
function chargerXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(!xlsxCharge) xlsxCharge = new Promise((ok,ko) => { const s=document.createElement('script'); s.src=XLSX_URL; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
  return xlsxCharge;
}
function normEntete(s){ return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
const ALIAS_COMMUNS = {
  dossard:['dossard','dos','doss','bib','numero','num','n','no','numero dossard'],
  licence:['licence','license','lic','n licence','no licence','numero licence','num licence','licence ffa','numero de licence','n de licence'],
  prenom:['prenom','first name','firstname','prenoms'],
  nom:['nom','nom de famille','last name','lastname','surname'],
  nomcomplet:['athlete','athletes','nom prenom','nom et prenom','concurrent','participant','identite'],
  club:['club','equipe','structure','club ffa','association'],
  sexe:['sexe','genre','sex','s'],
  cat:['categorie','cat','category'],
  naissance:['annee','naissance','date de naissance','ne le','nee le','an','annee de naissance','ddn']
};
function aliasListing(){ return {...ALIAS_COMMUNS, ...(LISTING.alias||{})}; }
function cleDeColonne(h){
  const n = normEntete(h); if(!n) return null;
  const al = aliasListing();
  for(const [k,v] of Object.entries(al)) if(v.includes(n)) return k;
  for(const [k,v] of Object.entries(al)) if(v.some(x => x.length>3 && n.startsWith(x))) return k;
  const mots = ' '+n+' ';
  for(const [k,v] of Object.entries(al)) if(v.some(x => x.length>4 && mots.includes(' '+x+' '))) return k;
  return null;
}
function analyserCSV(txt){
  const l1 = (txt.split(/\r?\n/).find(x => x.trim())||'');
  const sep = [';','\t',','].map(s => [s, l1.split(s).length]).sort((a,b) => b[1]-a[1])[0][0];
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; continue; }
    if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && txt[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x));
}
function separerNomComplet(t){
  const mots = String(t||'').trim().split(/\s+/); if(mots.length<2) return {nom:t||'', prenom:''};
  const maj = mots.filter(m => m===m.toUpperCase() && /[A-ZÀ-Ý]/.test(m));
  if(maj.length && maj.length<mots.length) return {nom:maj.join(' '), prenom:mots.filter(m => !maj.includes(m)).join(' ')};
  return {nom:mots[0], prenom:mots.slice(1).join(' ')};
}
function normSexe(v){ v=normEntete(v); if(!v) return ''; if(/^(f|w|femme|feminin|fille|d|dame)/.test(v)) return 'F'; if(/^(h|m|homme|masculin|garcon|g)/.test(v)) return 'H'; return ''; }
function lignesVersObjets(rows){
  if(!rows.length) return {objets:[], colonnes:[]};
  let ent=-1, map=null;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const m = rows[i].map(cleDeColonne);
    if(m.filter(Boolean).length>=2){ ent=i; map=m; break; }
  }
  if(!map){ map = LISTING.ordre.slice(); ent=-1; }
  const objets=[];
  rows.slice(ent+1).forEach(r => {
    const o={};
    map.forEach((k,j) => { if(k && r[j]!=null && String(r[j]).trim()!=='' && o[k]==null) o[k]=String(r[j]).trim(); });
    if(o.nomcomplet && !o.nom){ Object.assign(o, separerNomComplet(o.nomcomplet)); }
    if(!o.nom && !o.prenom) return;
    if(o.sexe!=null) o.sexe = normSexe(o.sexe);
    objets.push(o);
  });
  return {objets, colonnes:[...new Set(map.filter(Boolean))]};
}
let importEnAttente = null;
function proposerImport(rows, source){
  const {objets, colonnes} = lignesVersObjets(rows);
  if(!objets.length){ toast('Aucun athlète reconnu dans '+source); return; }
  proposerObjets(objets, colonnes);
}

    <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="impRemplacer" ${fictif?'checked':''}> Remplacer la liste actuelle</label>
    <div class="actions"><button class="btn bleu" data-act="okImport">Importer</button><button class="btn" data-act="fermer">Annuler</button></div>`);

async function lireFichierListing(f){
  if(!f) return;
  try{
    if(/\.(xlsx|xlsm|xls|ods)$/i.test(f.name)){
      await chargerXLSX();
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
      const ws = wb.Sheets[wb.SheetNames.find(n => /particip|athl|engag|inscri|liste/i.test(n)) || wb.SheetNames[0]];
      proposerImport(XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''}).map(r => r.map(x => String(x??'').trim())), f.name);
    } else {
      const buf = await f.arrayBuffer();
      let t = new TextDecoder('utf-8').decode(buf);
      if(t.includes('\uFFFD')) t = new TextDecoder('windows-1252').decode(buf);
      proposerImport(analyserCSV(t.replace(/^\uFEFF/,'')), f.name);
    }
  }catch(e){ toast('Lecture impossible : '+(/\.(xlsx|xls|ods)$/i.test(f.name)?'le lecteur Excel n’a pas pu se charger, enregistrez le fichier en CSV':'fichier illisible')); }
}

function genererFictifs(n, sexe){

  for(let i=0;i<n;i++){

let tvFlash=0;

    <table class="tv-res ${enLigne()?'compact':''}">${s?couloirsDe(s).filter(x => x.a).slice(0,enLigne()?16:10).map(x => `<tr><td class="co">${enLigne()?esc(x.a.dossard||''):x.c}</td><td class="nm">${esc(nomComplet(x.a))}<small>${esc(x.a.club||'')}</small></td>${enLigne()?'':`<td class="ds">${esc(x.a.dossard||'')}</td>`}</tr>`).join(''):''}</table></div>`; }

}

setInterval(() => {

  if(vue==='arrivee' && CAM.enreg && K.etat==='partie' && K.departT!=null && horlogeArrivee()-K.departT>600000) arreterEnregistrement('duree');
}, 50);
setInterval(() => { const e=document.getElementById('tvHeure'); if(e) e.textContent=new Date().toTimeString().slice(0,5); }, 10000);

/* ---------- Navigation, modales ---------- */
let verrou=null;
async function garderEcran(){ try{ if('wakeLock' in navigator && !verrou){ verrou=await navigator.wakeLock.request('screen'); verrou.addEventListener('release',()=>verrou=null); } }catch(e){} }
function allerA(v){
  if(!VUES.some(([k]) => k===v)) v='courses'; vue=v; const tv=v==='tv';
  document.getElementById('tv').hidden=!tv; document.getElementById('appJuge').hidden=tv;
  if(tv || v==='arrivee' || v==='depart') garderEcran();
  try{ if(location.hash!=='#'+v) history.replaceState(null,'','#'+v); }catch(e){}
  toutRendre(); window.scrollTo(0,0); if(T.mode==='libre') majLiaison(); echantillons=[]; decalRtt=null; pinguer();
}
window.addEventListener('hashchange', () => { const h=location.hash.slice(1); if(h && h!==vue) allerA(h); });
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') garderEcran(); });
let tToast=null;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('vu'); clearTimeout(tToast); tToast=setTimeout(()=>t.classList.remove('vu'),3200); }
function ouvrirModale(html){ const m=document.getElementById('modale'); m.innerHTML=`<div class="boite" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; }
function fermerModale(){ const m=document.getElementById('modale'); m.hidden=true; m.innerHTML=''; }
let actionConfirmee=null;
function confirmer(msg,ok,lib='Confirmer'){ actionConfirmee=ok; ouvrirModale(`<h3>${msg}</h3><div class="actions"><button class="btn rose" data-act="okConfirm">${lib}</button><button class="btn" data-act="fermer">Annuler</button></div>`); }
document.getElementById('modale').addEventListener('click', e => { if(e.target.id==='modale') fermerModale(); });
let telechargement=null;
(async () => { try{ if(window.claude && typeof claude.use==='function') telechargement=await claude.use('downloads'); }catch(e){} })();
async function exporterCSV(){
  const L=[['Rang','Série','Couloir','Dossard','Licence','Prénom','Nom','Club','Sexe','Catégorie','Temps','Temps (1/1000)','Statut','Vent']];
  const G=classementGeneral();
  D.series.forEach(s => lignesResultats(s).forEach(r => { const a=A(r.id)||{}; const g=G.find(x => x.id===r.id && x.serie.id===s.id);
    L.push([g?g.rang:'', s.nom, r.couloir, a.dossard||'', a.licence||'', a.prenom||'', a.nom||'', a.club||'', a.sexe||'', a.cat||'', r.statut?'':fT(r.t), r.t!=null?fT(r.t,true):'', r.statut||'', s.vent??'']); }));
  const csv='\uFEFF'+L.map(r => r.map(v => { const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
  const nom=(C().nom+'-'+C().epreuve).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase()+'.csv';
  if(telechargement){ try{ await telechargement.save({filename:nom, data:csv}); return; }catch(e){ if(e&&e.code==='cancelled') return; } }
  try{ const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})), l=document.createElement('a'); l.href=u; l.download=nom; document.body.appendChild(l); l.click(); l.remove(); }catch(e){ toast('Téléchargement indisponible'); }
}

  activerMicro: async () => { if(await activerMicro()){ if(K.etat==='pret' && ecouteIci()) MIC.arme=true; toutRendre(); } },
  fautif: b => { const c=+b.dataset.c, s=serieCourante(); fermerModale(); publierK('attente', {faux:[...(K.faux||[]), {serie:s.id, c, ts:Date.now()}], departT:null}); toast(c?`Couloir ${c} disqualifié pour faux départ`:'Départ annulé sans sanction'); },
  camera: async () => { if(await activerCamera()) toutRendre(); },
  calCouloirs: () => { if(CAM.calTap==='couloirs'){ CAM.calTap=null; toutRendre(); return; } CAL.pts=[]; CAL.hauts=[]; CAM.calTap='couloirs'; calculerLigne(); toutRendre(); },

  effacerCal: () => confirmer('Effacer la calibration de la caméra ?', () => { CAL={pts:[],hauts:[]}; try{ localStorage.removeItem(CLE_CAL); }catch(e){} calculerLigne(); toutRendre(); }, 'Effacer'),
  stopEnreg: () => arreterEnregistrement('manuel'), ouvrirLecture,
  fermerLecture: () => { lectureOuverte=false; toutRendre(); },

function offListe(){ const c=EXPORT.config(); if(!Array.isArray(c.officiels)) c.officiels=[]; return c.officiels; }
function offSign(){ const st=EXPORT.etat(); if(!st.signatures || typeof st.signatures!=='object') st.signatures={}; return st.signatures; }
function empreinte(){ const t=JSON.stringify(EXPORT.sections().map(s => s.lignes)); let h=5381; for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }

let padTrace=false, padVide=true;
function ouvrirPad(id){
  const o=offListe().find(x => x.id===id); if(!o) return;
  ouvrirModale(`<h3>Signature : ${esc(o.nom)}</h3><p class="discret">${esc(o.role)}${o.licence?' · licence '+esc(o.licence):''}. En signant, l’officiel certifie l’exactitude des résultats de « ${esc(EXPORT.titre())} ».</p>
    <canvas id="pad" class="pad" width="900" height="300" aria-label="Zone de signature"></canvas>
    <div class="actions"><button class="btn bleu" data-act="offValider" data-id="${o.id}">Valider la signature</button><button class="btn" data-act="offEffacerPad">Effacer</button><button class="btn" data-act="fermer">Annuler</button></div>`);
  const cv=document.getElementById('pad'), ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0A0F33'; padVide=true;
  const pos=e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width, (e.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener('pointerdown', e => { padTrace=true; padVide=false; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if(!padTrace) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); });
  cv.addEventListener('pointerup', () => { padTrace=false; });
}
function validerPad(id){
  const o=offListe().find(x => x.id===id), cv=document.getElementById('pad'); if(!o||!cv) return;
  if(padVide){ toast('Signez dans le cadre blanc'); return; }
  const m=document.createElement('canvas'); m.width=450; m.height=150; const c=m.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,450,150); c.drawImage(cv,0,0,450,150);
  offSign()[id]={img:m.toDataURL('image/png'), ts:Date.now(), nom:o.nom, role:o.role, licence:o.licence||'', empreinte:empreinte()};
  fermerModale(); EXPORT.sauver(); toast('Signature enregistrée');
}

const JSPDF_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', AUTOTABLE_URL='https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js';
let pdfCharge=null;
function chargerScript(u){ return new Promise((ok,ko) => { const s=document.createElement('script'); s.src=u; s.onload=ok; s.onerror=ko; document.head.appendChild(s); }); }
function chargerPDF(){ if(!pdfCharge) pdfCharge=(window.jspdf?Promise.resolve():chargerScript(JSPDF_URL)).then(() => chargerScript(AUTOTABLE_URL)); return pdfCharge; }
function txtPDF(v){ return String(v??'').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—−]/g,'-').replace(/…/g,'...').replace(/\u00a0|\u202f/g,' ').replace(/[^\x00-\xff]/g,'?'); }
async function exporterPDF(forcer){
  const L=offListe(), S_=offSign(), emp=empreinte();
  const manque=L.filter(o => !S_[o.id]), perimes=L.filter(o => S_[o.id] && S_[o.id].empreinte!==emp);
  if(!forcer && (manque.length || perimes.length || !L.length)){
    ouvrirModale(`<h3>Avant l’envoi</h3><p>${!L.length?'Aucun officiel n’est déclaré.':''}${manque.length?` Signature manquante : ${manque.map(o => esc(o.nom)).join(', ')}.`:''}${perimes.length?` Résultats modifiés après la signature de ${perimes.map(o => esc(o.nom)).join(', ')}.`:''}</p>
      <div class="actions"><button class="btn rose" data-act="pdfForcer">Exporter quand même</button><button class="btn" data-act="fermer">Revenir</button></div>`);
    return;
  }
  try{ await chargerPDF(); }catch(e){ toast('Le générateur de PDF n’a pas pu se charger (connexion ?)'); return; }
  const secs=EXPORT.sections(), large=Math.max(...secs.map(s => s.colonnes.length))>9;
  const doc=new window.jspdf.jsPDF({orientation:large?'landscape':'portrait', unit:'mm', format:'a4'});
  const W=doc.internal.pageSize.getWidth(), Hh=doc.internal.pageSize.getHeight(), c=EXPORT.config();
  doc.setFillColor(30,70,255); doc.rect(0,0,W/2,3,'F'); doc.setFillColor(232,19,122); doc.rect(W/2,0,W/2,3,'F');
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(232,19,122); doc.text('#TEAMBRO', 14, 15);
  doc.setTextColor(30,70,255); doc.text(txtPDF(EXPORT.titre()), 14+doc.getTextWidth('#TEAMBRO ')+1, 15);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(60,66,110);
  doc.text(txtPDF([c.nom, c.lieu, c.date ? new Date(c.date+'T12:00').toLocaleDateString('fr-FR',{dateStyle:'long'}) : ''].filter(Boolean).join('  ·  ')), 14, 21);
  let y=27;
  secs.forEach(sec => {
    if(sec.titre){ doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(10,15,51); doc.text(txtPDF(sec.titre), 14, y+2); y+=5; }
    if(sec.note){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(74,82,131); doc.text(txtPDF(sec.note), 14, y+2); y+=5; }
    doc.autoTable({startY:y, head:[sec.colonnes.map(txtPDF)], body:sec.lignes.map(r => r.map(txtPDF)), margin:{left:14, right:14},
      styles:{font:'helvetica', fontSize:sec.colonnes.length>14?6.5:sec.colonnes.length>9?8:9, cellPadding:1.4, textColor:[10,15,51], lineColor:[205,211,242], lineWidth:.1},
      headStyles:{fillColor:[30,70,255], textColor:255, fontStyle:'bold'}, alternateRowStyles:{fillColor:[238,241,255]}});
    y=doc.lastAutoTable.finalY+8; if(y>Hh-40){ doc.addPage(); y=16; }
  });
  // Officiels
  if(y>Hh-60){ doc.addPage(); y=16; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(10,15,51); doc.text('Officiels', 14, y); y+=4;
  if(!L.length){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('Aucun officiel déclaré.', 14, y+4); y+=10; }
  const colW=(W-28)/(large?4:3); let x=14;
  L.forEach((o,i) => {
    if(x+colW>W-10){ x=14; y+=34; } if(y>Hh-38){ doc.addPage(); y=16; x=14; }
    const sg=S_[o.id];
    doc.setDrawColor(205,211,242); doc.roundedRect(x, y, colW-4, 30, 2, 2);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(10,15,51); doc.text(txtPDF(o.nom), x+3, y+5);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(74,82,131); doc.text(txtPDF(o.role+(o.licence?' · lic. '+o.licence:'')), x+3, y+9);
    if(sg){ try{ doc.addImage(sg.img, 'PNG', x+3, y+11, 39, 13); }catch(e){} doc.setFontSize(7); doc.text(txtPDF((sg.empreinte!==emp?'Signé AVANT modification des résultats, le ':'Signé le ')+new Date(sg.ts).toLocaleString('fr-FR')), x+3, y+28); }
    else { doc.setTextColor(232,19,122); doc.text('Non signé', x+3, y+18); }
    x+=colW;
  });
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(124,131,171); doc.text(txtPDF(`Généré par #TEAMBRO le ${new Date().toLocaleString('fr-FR')} · empreinte des résultats ${emp} · page ${i}/${n}`), 14, Hh-6); }
  const nom=(c.nom+'-'+EXPORT.titre()).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase()+'.pdf';
  const blob=doc.output('blob');
  if(typeof telechargement!=='undefined' && telechargement){ try{ await telechargement.save({filename:nom, data:blob}); return; }catch(e){ if(e&&e.code==='cancelled') return; } }
  try{ const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download=nom; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),3000); }catch(e){ toast('Téléchargement indisponible ici'); }
}

function tableauxResultats(){
  const secs=[];
  D.series.forEach(s => { if(!D.resultats[s.id]) return; secs.push({titre:s.nom, note:s.vent!=null?`Vent : ${s.vent>0?'+':''}${String(s.vent).replace('.',',')} m/s`:'',
    colonnes:['Pl.', enLigne()?'N°':'Couloir','Doss.','Licence','Athlète','Club','Cat.','Temps'],
    lignes:lignesResultats(s).map(r => { const a=A(r.id)||{}; return [r.statut?'':r.place||'', r.couloir, a.dossard||'', a.licence||'', nomComplet(a), a.club||'', a.cat||'', r.statut||fT(r.t)]; })}); });
  const G=classementGeneral(); if(G.length && D.series.length>1) secs.push({titre:'Classement général', colonnes:['Rg','Doss.','Licence','Athlète','Club','Série','Temps'], lignes:G.map(x => { const a=A(x.id)||{}; return [x.rang, a.dossard||'', a.licence||'', nomComplet(a), a.club||'', x.serie.nom, fT(x.t)]; })});
  if(!secs.length) secs.push({titre:'Résultats', colonnes:['Information'], lignes:[['Aucun résultat validé']]});
  return secs;
}
const EXPORT={etat:() => D, config:() => C(), sections:tableauxResultats, titre:() => C().epreuve||'Course', sauver:() => publierD()};
function serieDeNumero(n){ return n ? D.series[n-1] : serieCourante(); }
const ASSIST={nom:'#TEAMBRO '+(enLigne()?'Running':'Sprint'), couloirs:true,
  suggestions:['Retirer le dossard 12','Mettre le 12 au couloir 4','Échanger 12 et 15','Le 15 est absent','Comment calibrer la caméra ?'],
  athletes:() => D.athletes.map(a => { const s=D.series.find(x => Object.values(x.couloirs).includes(a.id)), c=s?Object.keys(s.couloirs).find(k => s.couloirs[k]===a.id):null; return {id:a.id, dossard:a.dossard, prenom:a.prenom, nom:a.nom, statut:a.statut==='abs'?'absent':'', pos:c||'', extra:s?`${s.nom}, ${enLigne()?'n°':'couloir'} ${c}`:'sans série'}; }),
  contexte:() => `${C().epreuve}, ${enLigne()?'course sans couloirs':'course en couloirs'}, ${D.series.length} série(s), série en cours : ${serieCourante()?.nom||'aucune'}, état : ${ETATS[K.etat]||K.etat}`,
  schema:`{"type":"retirer","id":"…"} retire l’athlète de la liste et des séries
{"type":"statut","id":"…","statut":"abs"|""} absent (DNS à la lecture) ou présent
{"type":"couloir","id":"…","couloir":n,"serie":n ou null} place l’athlète au couloir (ou au numéro) n de la série n (série en cours si null) ; échange avec l’occupant
{"type":"echanger","id":"…","id2":"…"} échange les places de deux athlètes
{"type":"modifier","id":"…","champ":"dossard|licence|prenom|nom|club|cat|pb","valeur":"…"} modifie la fiche`,
  instantane:() => JSON.stringify({athletes:D.athletes, series:D.series}),
  restaurer:t => { const o=JSON.parse(t); D.athletes=o.athletes; D.series=o.series; },
  executer:ac => {
    const a=A(ac.id); if(!a) throw new Error('athlète introuvable');
    const ou=id => { for(const s of D.series) for(const k of Object.keys(s.couloirs)) if(s.couloirs[k]===id) return {s,k}; return null; };
    if(ac.type==='retirer'){ D.athletes=D.athletes.filter(x => x.id!==a.id); D.series.forEach(s => Object.keys(s.couloirs).forEach(k => { if(s.couloirs[k]===a.id) delete s.couloirs[k]; })); }
    else if(ac.type==='statut') a.statut=ac.statut||'';
    else if(ac.type==='couloir' || ac.type==='deplacer'){ const s=serieDeNumero(ac.serie); if(!s) throw new Error('série introuvable'); const c=String(ac.couloir||ac.position); const p=ou(a.id), occ=s.couloirs[c];
      if(p) delete p.s.couloirs[p.k]; if(occ && p) p.s.couloirs[p.k]=occ; s.couloirs[c]=a.id; }
    else if(ac.type==='echanger'){ const b=A(ac.id2); const pa=ou(a.id), pb=ou(b?.id); if(!pa||!pb) throw new Error('les deux athlètes doivent être dans une série'); pa.s.couloirs[pa.k]=b.id; pb.s.couloirs[pb.k]=a.id; }
    else if(ac.type==='modifier'){ if(['dossard','licence','prenom','nom','club','cat','pb'].includes(ac.champ)) a[ac.champ]=String(ac.valeur??''); else throw new Error('champ inconnu'); }
    else return false;
  },
  sauver:() => publierD(),
  aide:[...FAQ_COMMUN,
    ['Installer le téléphone d’arrivée','Sur pied, le plus haut possible, exactement dans l’alignement de la ligne. Onglet Arrivée : « Calibrer les couloirs » puis « Calibrer la hauteur » avec un jalon.',['calibr','camera','installer','pied','jalon']],
    ['Départ et faux départ','Onglet Départ : « Prêt » arme le micro, le coup de pistolet lance le chrono, un second coup dans les 5 s déclare un faux départ. Choisissez alors le couloir fautif.',['depart','pistolet','faux','rappel','starter']],
    ['Lire le photo-finish','Après l’arrivée : « Pointer » un couloir puis touchez le torse sur l’image, vérifiez les temps et « Valider les résultats ».',['lire','lecture','photo','pointer','torse']],
    ['Course sans couloirs','Réglages, Type de course : « Sans couloirs ». Pendant la course, « Passage de la tête » compte les tours. À la lecture, touchez chaque torse puis choisissez le dossard.',['demi','fond','couloirs','tour','cloche','800','1500']],
    ['Changer un athlète de couloir','Onglet Séries : menu déroulant de chaque couloir. Ou dites-moi « mettre le 12 au couloir 4 de la série 2 ».',['couloir','serie','changer']]]
};
/* ---------- Démonstration : courses fictives ---------- */
function simulerDemo(objets, av, remplacer){
  const tr=toutRendre; toutRendre=() => {};
  try{
    if(remplacer){ D.athletes=[]; D.series=[]; D.resultats={}; }
    objets.forEach((o,i) => LISTING.fictif(o, i, objets.length, Math.random()));
    importEnAttente=objets; ACT.okImport();
    if(!D.series.length) construireSeries();
    const nb = av>=1 ? D.series.length : Math.max(1, Math.floor(D.series.length*av));
    D.series.slice(0,nb).forEach(s => {
      D.resultats[s.id]=Object.entries(s.couloirs).map(([c,id]) => { const a=A(id), dnf=Math.random()<0.04;
        const t = enLigne() ? (distanceCourse()||1500)/(5+Math.random()*1.7)*1000 : num(a?.pb,12.5)*1000*(1+Math.random()*0.04);
        return {couloir:+c, id, t:dnf?null:Math.round(t), statut:dnf?'DNF':''}; });
      s.vent = enLigne() ? null : Math.round((Math.random()*3-0.8)*10)/10;
    });
    D.courante=(D.series[nb]||D.series[D.series.length-1]).id;
  } finally { toutRendre=tr; }
  publierD(false); publierK(av>=1?'valide':'attente', {serie:D.courante, departT:null, faux:[]});
}
/* =========================================================
   Assistant : commandes en langage courant
   ========================================================= */
let samplerIA=null, histoAssist=[], annulerAssist=null;
(async () => { try{ if(window.claude && typeof claude.use==='function') samplerIA=await claude.use('sample'); }catch(e){} })();
function nrm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,' ').replace(/\s+/g,' ').trim(); }
function trouverAthletes(txt){
  const L=ASSIST.athletes(), t=' '+nrm(txt)+' ', res=[];
  const nums=[...t.matchAll(/(?:dossard|doss|n°|no|numero|#|le)\s*(\d{1,5})\b/g)].map(m => m[1]);
  nums.forEach(n => { const a=L.find(x => String(x.dossard)===n); if(a && !res.includes(a)) res.push(a); });
  L.forEach(a => { const p=nrm(a.prenom), n=nrm(a.nom); if(!n) return;
    const ok = (p && t.includes(' '+p+' '+n+' ')) || (p && t.includes(' '+n+' '+p+' ')) || (n.length>2 && t.includes(' '+n+' ') && L.filter(x => nrm(x.nom)===n).length===1) || (p.length>2 && t.includes(' '+p+' ') && L.filter(x => nrm(x.prenom)===p).length===1);
    if(ok && !res.includes(a)) res.push(a); });
  if(!res.length){ const seuls=[...t.matchAll(/\b(\d{1,4})\b/g)].map(m => m[1]); seuls.forEach(n => { const a=L.find(x => String(x.dossard)===n); if(a && !res.includes(a)) res.push(a); }); }
  return res;
}
function analyseLocale(txt){
  const t=nrm(txt), cibles=trouverAthletes(txt), n=ASSIST.athletes().length;
  const a=cibles[0];
  if(/^(aide|\?|que (peux|sais)|comment|ou |où |pourquoi|quand)/.test(t) || /comment /.test(t)) return {aide:true};
  if(!a) return null;
  if(/(echang|invers|permut)/.test(t) && cibles[1]) return {actions:[{type:'echanger', id:a.id, id2:cibles[1].id}]};
  if(/(retir|enlev|supprim|efface|sortir)/.test(t)) return {actions:[{type:'retirer', id:a.id}]};
  if(/(absent|forfait|dns|pas venu|non partant)/.test(t)) return {actions:[{type:'statut', id:a.id, statut:'abs'}]};
  if(/(abandon|blesse|arrete)/.test(t)) return {actions:[{type:'statut', id:a.id, statut:'ab'}]};
  if(/(reintegr|remettre en competition|retablir|annuler l absence|de retour)/.test(t)) return {actions:[{type:'statut', id:a.id, statut:''}]};
  if(ASSIST.couloirs && /couloir\s*(\d{1,2})/.test(t)){ const c=+t.match(/couloir\s*(\d{1,2})/)[1]; const sm=t.match(/(?:serie|course)\s*(\d{1,2})/); return {actions:[{type:'couloir', id:a.id, couloir:c, serie:sm?+sm[1]:null}]}; }
  let pos=null; const ap=a.pos||1;
  if(/en (premier|tete|1er)|en premiere position/.test(t)) pos=1; else if(/en dernier|a la fin|en derniere position/.test(t)) pos=n;
  else { const m=t.match(/(?:position|place|rang|ordre|en|au)\s*(?:n°|no|numero)?\s*(\d{1,3})\b(?!\s*(?:m|cm|kg))/); if(m && /(mett|plac|deplac|pass|chang|bouge|ordre|position|rang)/.test(t)) pos=+m[1]; }
  if(pos==null && /(remonte|monter|avance|plus tot)/.test(t)) pos=Math.max(1,ap-1);
  if(pos==null && /(descend|recule|plus tard|apres)/.test(t)) pos=Math.min(n,ap+1);
  if(pos!=null && /(mett|plac|deplac|pass|chang|bouge|ordre|position|rang|monte|descend|avance|recule|premier|dernier|tete|fin)/.test(t)) return {actions:[{type:'deplacer', id:a.id, position:pos}]};
  return null;
}
function decrire(ac){
  const A_=id => { const a=ASSIST.athletes().find(x => x.id===id); return a ? `${a.prenom} ${String(a.nom||'').toUpperCase()}${a.dossard?' (dossard '+a.dossard+')':''}` : 'athlète inconnu'; };
  switch(ac.type){
    case 'retirer': return `Retirer ${A_(ac.id)} de la liste`;
    case 'statut': return ac.statut==='abs' ? `Déclarer ${A_(ac.id)} absent` : ac.statut==='ab' ? `Déclarer l’abandon de ${A_(ac.id)}` : `Remettre ${A_(ac.id)} en compétition`;
    case 'deplacer': return `Placer ${A_(ac.id)} en position ${ac.position} de l’ordre de passage`;
    case 'echanger': return `Échanger ${A_(ac.id)} et ${A_(ac.id2)}`;
    case 'modifier': return `Modifier ${ac.champ} de ${A_(ac.id)} : ${ac.valeur}`;
    case 'couloir': return `Mettre ${A_(ac.id)} au couloir ${ac.couloir}${ac.serie?' de la série '+ac.serie:''}`;
    default: return ASSIST.decrire ? ASSIST.decrire(ac) : JSON.stringify(ac);
  }
}
function ajouterMsg(qui, html){ histoAssist.push({qui, html}); const f=document.getElementById('aideFil'); if(f){ f.insertAdjacentHTML('beforeend', `<div class="aide-msg ${qui}">${html}</div>`); f.scrollTop=f.scrollHeight; } }
let propositions=null;
function proposer(reponse, actions){
  propositions=actions||[];
  ajouterMsg('app', `${reponse?esc(reponse):''}${propositions.length?`<ul>${propositions.map(a => `<li>${esc(decrire(a))}</li>`).join('')}</ul><div class="actions"><button class="btn bleu petit" data-act="assistOk">Appliquer</button><button class="btn petit" data-act="assistNon">Annuler</button></div>`:''}`);
}
function texteAide(){ return ASSIST.aide.map(([q,r]) => `• ${q}\n${r}`).join('\n\n'); }
async function demanderAssistant(txt){
  txt=String(txt||'').trim(); if(!txt) return;
  ajouterMsg('moi', esc(txt));
  const loc=analyseLocale(txt);
  if(loc && loc.actions){ proposer('Voici ce que je propose :', loc.actions); return; }
  const faq=ASSIST.aide.find(([q,r,mots]) => (mots||[]).some(m => nrm(txt).includes(m)));
  if(!samplerIA){
    if(faq){ ajouterMsg('app', `<b>${esc(faq[0])}</b>\n${esc(faq[1])}`); return; }
    ajouterMsg('app', esc('Je n’ai pas compris. Essayez par exemple : « retirer le dossard 12 », « Léa Martin est absente », « mettre Martin en position 3 », « échanger 12 et 15 ».'+(loc&&loc.aide?'\n\n'+texteAide():'')));
    return;
  }
  ajouterMsg('app', '<i>Je réfléchis…</i>');
  const fil=document.getElementById('aideFil'), att=fil && fil.lastElementChild;
  const prompt=`Tu es l’assistant de l’application « ${ASSIST.nom} » de gestion de compétition d’athlétisme (règlement World Athletics et FFA). Réponds en français, brièvement, avec des apostrophes typographiques.
Mode d’emploi de l’application :
${texteAide()}

État actuel : ${ASSIST.contexte()}
Athlètes (id | dossard | prénom nom | statut | position) :
${ASSIST.athletes().map(a => `${a.id} | ${a.dossard||''} | ${a.prenom||''} ${a.nom||''} | ${a.statut||'en compétition'} | ${a.pos||''}${a.extra?' | '+a.extra:''}`).join('\n')}

Actions possibles (n’utilise que celles-ci, avec les id ci-dessus) :
${ASSIST.schema}

Demande de l’utilisateur : « ${txt} »
Réponds UNIQUEMENT avec un objet JSON : {"reponse": "phrase courte pour l’utilisateur", "actions": [ ... ]}. Si la demande est une question ou est ambiguë, "actions" est vide et "reponse" explique ou pose une question.`;
  try{
    const r=await samplerIA.json(prompt, {modelTier:'quick'});
    if(att) att.remove();
    const acts=(Array.isArray(r.actions)?r.actions:[]).filter(a => a && a.type && (!a.id || ASSIST.athletes().some(x => x.id===a.id)));
    proposer(r.reponse||'', acts);
  }catch(e){ if(att) att.remove(); ajouterMsg('app', esc(faq ? faq[0]+'\n'+faq[1] : 'L’assistant n’est pas disponible pour le moment. '+(e&&e.code==='not_granted'?'Autorisez Claude pour l’utiliser.':''))); }
}
function appliquerPropositions(){
  if(!propositions||!propositions.length) return;
  const avant=ASSIST.instantane(); let ok=0; const err=[];
  propositions.forEach(a => { try{ const m=ASSIST.executer(a); if(m===false) err.push(decrire(a)); else ok++; }catch(e){ err.push(decrire(a)+' : '+e.message); } });
  propositions=null; ASSIST.sauver();
  annulerAssist=avant;
  ajouterMsg('app', `${ok} action${ok>1?'s':''} appliquée${ok>1?'s':''}.${err.length?'\nNon appliqué : '+esc(err.join(' ; ')):''}<div class="actions"><button class="btn petit" data-act="assistDefaire">Défaire</button></div>`);
}
function construireAssistant(){
  if(document.getElementById('aideBtn')) return;
  document.body.insertAdjacentHTML('beforeend', `<button id="aideBtn" data-act="assistOuvrir" aria-expanded="false">Aide</button>
  <div id="aidePanneau" hidden role="dialog" aria-label="Assistant"><div class="aide-tete"><b>Assistant</b><button class="btn petit" data-act="assistFermer">Fermer</button></div>
    <div class="aide-fil" id="aideFil"><div class="aide-msg app">Dites-moi ce que vous voulez faire, par exemple : « retirer le dossard 12 », « Léa Martin est absente », « mettre Martin en 3e position », « échanger 12 et 15 »${ASSIST.couloirs?', « mettre le 12 au couloir 4 »':''}. Vous pouvez aussi poser une question sur l’app.</div></div>
    <div class="aide-puces">${ASSIST.suggestions.map(s => `<button data-act="assistPuce" data-t="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="aide-saisie"><input id="aideTexte" type="text" placeholder="Votre demande" autocomplete="off"><button class="btn bleu" data-act="assistEnvoyer">OK</button></div></div>`);
}
function majVisibiliteAssistant(){ const b=document.getElementById('aideBtn'); if(!b) return; const tv=document.getElementById('tv'), mo=document.getElementById('module'), cache=(tv && !tv.hidden) || (document.getElementById('ecran') && !document.getElementById('ecran').hidden) || (mo && !mo.hidden); b.hidden=!!cache; if(cache) document.getElementById('aidePanneau').hidden=true; }
setInterval(majVisibiliteAssistant, 700);
document.addEventListener('click', e => {
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if(a==='assistOuvrir'){ const p=document.getElementById('aidePanneau'); p.hidden=!p.hidden; b.setAttribute('aria-expanded', String(!p.hidden)); if(!p.hidden) document.getElementById('aideTexte').focus(); }
  else if(a==='assistFermer'){ document.getElementById('aidePanneau').hidden=true; }
  else if(a==='assistEnvoyer'){ const i=document.getElementById('aideTexte'); demanderAssistant(i.value); i.value=''; }
  else if(a==='assistPuce'){ const i=document.getElementById('aideTexte'); i.value=b.dataset.t; i.focus(); }
  else if(a==='assistOk') appliquerPropositions();
  else if(a==='assistNon'){ propositions=null; ajouterMsg('app','D’accord, rien n’a été modifié.'); }
  else if(a==='assistDefaire'){ if(annulerAssist){ ASSIST.restaurer(annulerAssist); annulerAssist=null; ASSIST.sauver(); ajouterMsg('app','C’est défait.'); } }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='aideTexte'){ e.preventDefault(); e.stopPropagation(); demanderAssistant(e.target.value); e.target.value=''; } }, true);
setTimeout(() => { if(!(typeof MODE_PUBLIC!=='undefined' && MODE_PUBLIC)) construireAssistant(); }, 0);

allerA((location.hash||'').slice(1)||window.__VUE_INITIALE||'courses');
initTransport();
</script>
